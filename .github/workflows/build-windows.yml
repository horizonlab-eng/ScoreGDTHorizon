# ScoreGDT – lizenzfreier Windows-Build für die Praxis
# Baut aus dem unveränderten Original-Quellcode (retconx/scoregdt) eine
# lauffähige Windows-Version. Die Lizenz-Abschnitte werden – wie im README
# des Autors beschrieben – erst beim Bauen entfernt. Dadurch bleibt der
# Fork jederzeit mit "Sync fork" aktualisierbar.

name: ScoreGDT Windows-Build

on:
  workflow_dispatch:        # Start per Knopf "Run workflow"
  push:
    branches: [main]        # und automatisch nach jedem "Sync fork"

permissions:
  contents: write           # nötig, um das Release anzulegen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 fpdf2 requests pyinstaller

      - name: Lizenz-Abschnitte entfernen und Praxis-Voreinstellungen setzen
        shell: python
        run: |
          import re, pathlib, sys
          dateien = ["main.py", "dialogEinstellungenLanrLizenzschluessel.py", "dialogEinstellungenImportExport.py"]
          for name in dateien:
              p = pathlib.Path(name)
              zeilen, ueberspringen, entfernt = [], False, 0
              for z in p.read_text(encoding="utf-8").splitlines(keepends=True):
                  s = z.strip()
                  if s == "## Nur mit Lizenz":
                      ueberspringen = True; entfernt += 1; continue
                  if s == "## /Nur mit Lizenz":
                      ueberspringen = False; continue
                  if not ueberspringen:
                      zeilen.append(z)
              if ueberspringen:
                  sys.exit(f"FEHLER: Block in {name} nicht geschlossen")
              p.write_text("".join(zeilen), encoding="utf-8")
              print(f"{name}: {entfernt} Lizenz-Abschnitt(e) entfernt")
          # Sicherheitsprüfung: main.py darf gdttoolsL nicht mehr verwenden
          if "gdttoolsL" in pathlib.Path("main.py").read_text(encoding="utf-8"):
              sys.exit("FEHLER: main.py verweist noch auf gdttoolsL – Autor hat den Code geändert, bitte prüfen")
          # Automatische Update-Prüfung abschalten (würde auf die lizenzpflichtige Original-Version verweisen)
          ini = pathlib.Path("config.ini")
          text = re.sub(r"(?m)^autoupdate\s*=.*$", "autoupdate = False", ini.read_text(encoding="utf-8"))
          ini.write_text(text, encoding="utf-8")
          version = re.search(r"(?m)^version\s*=\s*(\S+)", text).group(1)
          import os
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SCOREGDT_VERSION={version}\n")
          print("Version:", version)

      - name: Programm bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed
          --name scoregdt
          --contents-directory "."
          --icon icons/program.ico
          --add-data "config.ini;."
          --add-data "eula.txt;."
          --add-data "scores;scores"
          --add-data "icons;icons"
          --add-data "fonts;fonts"
          --add-data "bilder;bilder"
          --add-data "pdf;pdf"
          main.py

      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path dist/scoregdt/* -DestinationPath "ScoreGDT-$env:SCOREGDT_VERSION-praxis-win64.zip"

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup wurde nicht gefunden" }
          @'
          #define MyVersion GetEnv("SCOREGDT_VERSION")

          [Setup]
          AppId={{6E2B8C41-3F7A-4D19-9B52-A1C7E0D4F823}
          AppName=ScoreGDT (Praxis-Build)
          AppVersion={#MyVersion}
          AppPublisher=Quellcode: Fabian Treusch (gdttools.de)
          DefaultDirName=C:\GDT\ScoreGDT
          DisableProgramGroupPage=yes
          DefaultGroupName=ScoreGDT
          OutputDir=.
          OutputBaseFilename=ScoreGDT-{#MyVersion}-praxis-Setup
          SetupIconFile=icons\program.ico
          UninstallDisplayIcon={app}\scoregdt.exe
          UninstallDisplayName=ScoreGDT (Praxis-Build)
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          CloseApplications=yes

          [Languages]
          Name: "de"; MessagesFile: "compiler:Languages\German.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Verknüpfung auf dem Desktop für alle Benutzer anlegen"

          [Dirs]
          Name: "{app}"; Permissions: users-modify
          Name: "{app}\log"; Permissions: users-modify
          Name: "{app}\pdf"; Permissions: users-modify

          [Files]
          Source: "dist\scoregdt\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{commonprograms}\ScoreGDT"; Filename: "{app}\scoregdt.exe"
          Name: "{commondesktop}\ScoreGDT"; Filename: "{app}\scoregdt.exe"; Tasks: desktopicon

          [UninstallDelete]
          Type: filesandordirs; Name: "{app}\log"
          Type: filesandordirs; Name: "{app}\pdf"
          '@ | Set-Content -Path scoregdt.iss -Encoding utf8BOM
          & $iscc scoregdt.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer-Bau fehlgeschlagen" }

      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SCOREGDT_VERSION-praxis-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "ScoreGDT-$env:SCOREGDT_VERSION-praxis-Setup.exe" "ScoreGDT-$env:SCOREGDT_VERSION-praxis-win64.zip" --title "ScoreGDT $env:SCOREGDT_VERSION (Praxis-Build $env:GITHUB_RUN_NUMBER)" --notes "Lizenzfreier Windows-Build aus dem Quellcode von retconx/scoregdt (Stand: Commit $env:GITHUB_SHA)."
