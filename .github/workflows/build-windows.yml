# ScoreGDT – Windows-Build für die Praxis am Horizont
#
# Gebaut wird IMMER der Zweig "praxis". Dort stehen alle Praxis-Anpassungen
# direkt im Code. Der Zweig "main" ist eine unveränderte Kopie des Originals
# (retconx/scoregdt) und wird nur über "Sync fork" aktualisiert.
#
# Ablauf bei einem Update des Autors:
#   1. "Sync fork" auf main
#   2. main in praxis übernehmen (merge)
#   3. Push auf praxis -> diese Bauanleitung baut automatisch
#
# Diese Datei ist in main und praxis identisch, damit beim Übernehmen
# keine Konflikte entstehen.

name: ScoreGDT Windows-Build

on:
  workflow_dispatch:        # Start per Knopf "Run workflow" (baut immer praxis)
  push:
    branches: [praxis]      # automatisch nach jeder Änderung an praxis

permissions:
  contents: write           # nötig, um das Release anzulegen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellcode (Zweig praxis) holen
        uses: actions/checkout@v5
        with:
          ref: praxis

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 fpdf2 requests pyinstaller

      - name: Sicherheitsprüfung und Versionskennung
        shell: python
        run: |
          import re, os, sys, pathlib
          # Sicherung: Es darf kein Lizenz-Code des Originals mehr enthalten sein
          for name in pathlib.Path(".").glob("*.py"):
              text = name.read_text(encoding="utf-8")
              if "## Nur mit Lizenz" in text or "import gdttoolsL" in text:
                  sys.exit(f"FEHLER: {name} enthält noch Lizenz-Code. Wurde main statt praxis gebaut?")
          ini = pathlib.Path("config.ini").read_text(encoding="utf-8")
          if not re.search(r"(?m)^autoupdate\s*=\s*False", ini):
              sys.exit("FEHLER: In config.ini muss autoupdate = False stehen.")
          version = re.search(r"(?m)^version\s*=\s*(\S+)", ini).group(1)
          tag = f"v{version}-praxis-{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SCOREGDT_VERSION={version}\nSCOREGDT_TAG={tag}\n")
          print("Version:", version, "| Build:", tag)

      - name: Programm bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed
          --name scoregdt
          --contents-directory "."
          --icon icons/program.ico
          --add-data "config.ini;."
          --add-data "eula.txt;."
          --add-data "scores;scores"
          --add-data "icons;icons"
          --add-data "fonts;fonts"
          --add-data "bilder;bilder"
          --add-data "pdf;pdf"
          main.py

      - name: Hilfsprogramm ScoreGDT-Start.exe übersetzen
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:dist\scoregdt\ScoreGDT-Start.exe /win32icon:icons\program.ico installer\ScoreGDT-Start.cs
          if ($LASTEXITCODE -ne 0) { throw "Hilfsprogramm konnte nicht übersetzt werden" }

      - name: Hilfsskripte und Build-Kennung beilegen
        shell: pwsh
        run: |
          Set-Content -Path dist/scoregdt/build.txt -Value $env:SCOREGDT_TAG -Encoding ascii
          Copy-Item installer/ScoreGDT-Update.ps1 dist/scoregdt/
          Copy-Item installer/ScoreGDT-Ordner.ps1 dist/scoregdt/

      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path dist/scoregdt/* -DestinationPath "ScoreGDT-$env:SCOREGDT_VERSION-praxis-win64.zip"

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup wurde nicht gefunden" }
          & $iscc installer/scoregdt.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer-Bau fehlgeschlagen" }

      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = git rev-parse --short HEAD
          gh release create $env:SCOREGDT_TAG "ScoreGDT-$env:SCOREGDT_VERSION-praxis-Setup.exe" "ScoreGDT-$env:SCOREGDT_VERSION-praxis-win64.zip" --target praxis --title "ScoreGDT $env:SCOREGDT_VERSION (Praxis-Build $env:GITHUB_RUN_NUMBER)" --notes "Windows-Build aus dem Zweig praxis (Commit $commit)."
